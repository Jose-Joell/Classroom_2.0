rx:d=>{U.rx[d.v]=U.rx[d.v]?0:1;svu();draw()},fcm:d=>{S.fo=S.fo||{};S.fo[d.v]=!S.fo[d.v];draw()},rpl:d=>{const p=d.v.split('|');S.rpl={f:p[0],i:+p[1]};draw()},
csend:d=>{const i=document.getElementById('cm-'+d.v),v=i.value.trim();if(!v)return toast('Escribe un comentario','bad');const a=D.an.find(x=>x.id===d.v),m={a:ME,t:v,ts:Date.now()};if(a){a.cm.push(m);svd()}else{(U.cmt[d.v]=U.cmt[d.v]||[]).push(m);svu()}toast('Comentario publicado');draw()},
rsend:d=>{const p=d.v.split('|'),i=document.getElementById('rr-'+p[0]),v=i.value.trim();if(!v)return toast('Escribe una respuesta','bad');const a=D.an.find(x=>x.id===p[0]),r={a:ME,t:v,ts:Date.now()};if(a){(a.cm[+p[1]].rp=a.cm[+p[1]].rp||[]).push(r);svd()}else{(U.rps[p[0]+':'+p[1]]=U.rps[p[0]+':'+p[1]]||[]).push(r);svu()}S.rpl=null;toast('Respuesta publicada');draw()},
msgdoc:d=>openM(mh('Mensaje a '+cl(d.v).t)+`<label class="fl" for="m-t">Mensaje</label><textarea class="fi" id="m-t" rows="4" placeholder="Escribe tu consulta…"></textarea><p class="mut" style="margin:8px 0 0">Demostración: el mensaje no se envía a ningún servidor.</p><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn s" data-a="closem">Cancelar</button><button class="btn" data-a="sendmd" data-v="${d.v}">${ic('send')}Enviar</button></div>`),
sendmd:d=>{if(!$('#m-t').value.trim())return toast('Escribe un mensaje','bad');closeM();toast('Mensaje enviado a '+cl(d.v).t+' (simulado)')},
actx:d=>{S.actx=d.v;go('asistente')},actx2:d=>{S.actx=d.v;draw()},gopage:d=>go(d.v),
cmtab:d=>{S.cmt=d.v;draw()},cmc:d=>{S.cmc=d.v;draw()},dbo:d=>{S.dbo=S.dbo===d.v?null:d.v;draw()},dlike:d=>{U.dl[d.v]=U.dl[d.v]?0:1;svu();draw()},
dpost:d=>{const v=document.getElementById('dp-'+d.v).value.trim();if(!v)return toast('Escribe tu aporte','bad');(U.deb[d.v]=U.deb[d.v]||[]).push({a:ME,t:v,ts:Date.now(),lk:0});svu();toast('Aporte publicado');draw()},
gopen:d=>{S.grp=d.v||null;draw()},gjoin:d=>{U.gj[d.v]=!U.gj[d.v];svu();toast(U.gj[d.v]?'Te uniste al grupo':'Saliste del grupo');draw()},
gsend:d=>{const i=document.getElementById('gc-'+d.v),v=i.value.trim();if(!v)return;(U.gchat[d.v]=U.gchat[d.v]||[]).push([ME,v]);svu();draw()},
gtog:d=>{const p=d.v.split(':'),L=U.gtodo[p[0]]=U.gtodo[p[0]]||GS[p[0]].todo.map(x=>[...x]);L[+p[1]][1]=L[+p[1]][1]?0:1;svu();draw()},
gtadd:d=>{const i=document.getElementById('gt-'+d.v),v=i.value.trim();if(!v)return;const L=U.gtodo[d.v]=U.gtodo[d.v]||GS[d.v].todo.map(x=>[...x]);L.push([v,0]);svu();draw()},
gnsave:d=>{U.gnote[d.v]=document.getElementById('gn-'+d.v).value;svu();toast('Notas del grupo guardadas')},
lt:d=>{S.lt=d.v;draw()},lv:d=>{S.lv=d.v;draw()},lopen:d=>libModal(d.v),lsum:d=>libModal(d.v,1),lsave:d=>{U.lib[d.v]=!U.lib[d.v];svu();toast(U.lib[d.v]?'Guardado en tu biblioteca':'Quitado de guardados');if($('#md').open)libModal(d.v);draw()},
lup:()=>openM(mh('Subir recurso')+`<label class="fl" for="u-t">Título</label><input class="fi" id="u-t" autocomplete="off"><div class="g2" style="grid-template-columns:1fr 1fr;gap:10px"><div><label class="fl" for="u-c">Asignatura</label><select class="fi" id="u-c">${opt(act().map(c=>[c.id,c.n]),'c1')}</select></div><div><label class="fl" for="u-y">Tipo</label><select class="fi" id="u-y">${opt(Object.keys(TY).map(k=>[k,TY[k][0]]),'pdf')}</select></div></div><label class="fl" for="u-f">Archivo (opcional)</label><input class="fi" id="u-f" type="file"><p id="merr" class="bad" role="alert" style="min-height:20px;margin:8px 0 0"></p><div class="row" style="justify-content:flex-end"><button class="btn s" data-a="closem">Cancelar</button><button class="btn" data-a="lupsave">Guardar</button></div>`),
lupsave:()=>{const t=$('#u-t').value.trim(),f=$('#u-f').files[0];if(!t&&!f)return $('#merr').textContent='Escribe un título o selecciona un archivo.';U.myres.push({id:'u'+Date.now(),c:$('#u-c').value,t:t||f.name,ty:$('#u-y').value,meta:f?f.name:'Recurso propio'});svu();closeM();toast('Recurso añadido a tu biblioteca');draw()},
et:d=>{S.et=d.v;draw()},pm:d=>{if(S.run)return toast('Pausa el temporizador para cambiar de modo','bad');S.pm=d.v;S.tm=S.tmax=PM[d.v]*60;$('#tm').textContent=fmt(S.tm);draw()},prun:()=>{togRun();draw()},prst:()=>{clearInterval(S.run);S.run=null;S.tm=S.tmax=PM[S.pm]*60;$('#rb').textContent='Iniciar';$('#tm').textContent=fmt(S.tm);draw()},
tdadd:()=>{const i=$('#td-n'),v=i.value.trim();if(!v)return toast('Escribe el pendiente','bad');U.todo.push({t:v,d:0});svu();draw()},tdtog:d=>{U.todo[+d.v].d=U.todo[+d.v].d?0:1;svu();draw()},tddel:d=>{U.todo.splice(+d.v,1);svu();draw()},
fcc:d=>{S.fcc=d.v;S.fci=0;S.fcf=false;draw()},fcflip:()=>{S.fcf=!S.fcf;draw()},fcrate:d=>{const L=allFC().filter(f=>S.fcc==='todas'||f.c===S.fcc),f=L[S.fci%L.length];U.fcs[f.id]=d.v;svu();S.fci++;S.fcf=false;draw()},
fcadd:()=>{const q=$('#fq').value.trim(),a=$('#fa2').value.trim();if(!q||!a)return toast('Completa la pregunta y la respuesta','bad');U.fc.push({id:'u'+Date.now(),c:S.fcc==='todas'?'c1':S.fcc,q,a});svu();toast('Tarjeta guardada');draw()},
fcgen:d=>{const c=d.v||'c1';let n=0;(GFC[c]||[]).forEach(x=>{if(!U.fc.some(f=>f.q===x[0])){U.fc.push({id:'u'+Date.now()+n,c,q:x[0],a:x[1]});n++}});svu();toast(n?n+' tarjetas guardadas en Flashcards':'Esas tarjetas ya están guardadas')},
qgo:d=>{S.et='quiz';S.qz=null;go('estudio');ACT.qstart({v:QZ.find(q=>q.c===d.v).id})},qstart:d=>{S.et='quiz';S.qz={id:d.v,i:0,sel:null,score:0,done:false};if(S.view!=='estudio')go('estudio');else draw()},
qans:d=>{const z=S.qz,q=QZ.find(x=>x.id===z.id);if(z.sel!=null)return;z.sel=+d.v;if(z.sel===q.q[z.i][2])z.score++;draw()},qnext:()=>{const z=S.qz,q=QZ.find(x=>x.id===z.id);if(z.i+1<q.q.length){z.i++;z.sel=null}else{z.done=true;U.qr[q.id]={s:z.score,ts:Date.now()};svu();toast('Cuestionario completado: '+z.score+'/'+q.q.length)}draw()},qexit:()=>{S.qz=null;draw()},
goal:d=>{const p=d.v.split(':');U.goal[p[0]]=Math.max(15,U.goal[p[0]]+ +p[1]);svu();draw()},fs:d=>{S.fs=d.v;draw()},
resetE:()=>confirmM('Restablecer datos','Se borrarán tus entregas, favoritos, notas y progreso de estudio.',()=>{['c2stu','c2pf','c2notes'].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});location.reload()},'Restablecer','refresh')});
Object.assign(IN,{cq:v=>{S.cq=v;$('#clist').innerHTML=clist()},lq:v=>{S.lq=v;$('#liblist').innerHTML=libList()}});
Object.assign(CH,{tc:v=>{S.tc=v;draw()},tpr:v=>{S.tpr=v;draw()},tdt:v=>{S.tdt=v;draw()},pcl:v=>{S.pcl=v},lc:v=>{S.lc=v;draw()},tfile:(v,e)=>{const t=tkey(S.tk);[...e.files].forEach(f=>{if(!t.files.includes(f.name))t.files.push(f.name)});if(t.st==='pend')t.st='prog';saveT();draw()}});
document.addEventListener('keydown',e=>{const id=e.target.id||'';if(e.key==='Enter'){if(id.startsWith('cm-'))ACT.csend({v:id.slice(3)});else if(id.startsWith('rr-')){const p=S.rpl;if(p)ACT.rsend({v:p.f+'|'+p.i})}else if(id.startsWith('gc-'))ACT.gsend({v:id.slice(3)});else if(id.startsWith('gt-'))ACT.gtadd({v:id.slice(3)});else if(id==='td-n')ACT.tdadd();else if(id==='tcm')ACT.tcmt()}});
Object.assign(R,RE);

/* ---- Accesibilidad: Escape cierra notificaciones, aria-expanded en la campana ---- */
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const n=$('#nt');if(n&&n.classList.contains('show')){n.classList.remove('show');const b=$('[data-bell]');if(b){b.setAttribute('aria-expanded','false');b.focus()}}}});
document.addEventListener('click',()=>{const b=$('[data-bell]'),n=$('#nt');if(b&&n)b.setAttribute('aria-expanded',n.classList.contains('show')?'true':'false')});


try{const t=localStorage.getItem('c2theme');if(t)theme(t)}catch(e){}
try{S.nts=JSON.parse(localStorage.getItem('c2notes')||'{}')}catch(e){}
try{const r=localStorage.getItem('c2role');if(r==='doc')S.role='doc'}catch(e){}
(function(){const h=location.hash.slice(1),doc=S.role==='doc';if(doc){if(h.startsWith('dclase-')&&dk(h.slice(7))){S.view='dclase';S.cls=h.slice(7)}else if(GD.flatMap(g=>g[1]).some(x=>x[0]===h))S.view=h;else S.view='panel'}else{if(h.startsWith('clase-')&&cl(h.slice(6))){S.view='clase';S.cls=h.slice(6)}else if(V.some(x=>x[0]===h))S.view=h}})();
draw();
</script></body></html>
